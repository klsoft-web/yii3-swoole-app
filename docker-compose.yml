services:

  app:
    build: .
    ports:
      - "9501:9501"
    volumes:
      # Mount for development
      - ./src:/app/src
      - ./config/common:/app/config/common
      - ./config/console:/app/config/console
      - ./config/web:/app/config/web
    command: ./yii swoole start --address=0.0.0.0 --port=9501 --same-process
